name: rendercheck
description: Fail the build when a generated render is silently broken.
branding:
  icon: activity
  color: purple

inputs:
  files:
    description: Files or directories to check. A directory checks the media inside it.
    required: true
  strict:
    description: Treat a check that could not run as a failure.
    required: false
    default: "false"
  preset:
    description: >-
      Loudness target for where these files are going: youtube, spotify, tiktok,
      podcast, apple, web, ebu, atsc, or netflix. Run `rendercheck presets` for
      the table. Also switches on the true-peak check.
    required: false
    default: ""
  version:
    description: Version of rendercheck to install. Defaults to the latest release.
    required: false
    default: ""
  args:
    description: Extra flags passed through to `rendercheck check`.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install ffmpeg
      shell: bash
      run: |
        if command -v ffmpeg >/dev/null 2>&1; then
          echo "ffmpeg already present"
        elif command -v apt-get >/dev/null 2>&1; then
          sudo apt-get update && sudo apt-get install -y ffmpeg
        elif command -v brew >/dev/null 2>&1; then
          brew install ffmpeg
        elif command -v choco >/dev/null 2>&1; then
          choco install ffmpeg -y
        else
          echo "::error::no way to install ffmpeg on this runner" && exit 1
        fi

    - name: Install rendercheck
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$VERSION" ]; then
          python -m pip install --disable-pip-version-check "rendercheck==$VERSION"
        else
          python -m pip install --disable-pip-version-check rendercheck
        fi

    # Inputs go through the environment rather than into the script body:
    # interpolating ${{ }} straight into a run block is a script-injection hole.
    - name: Check
      shell: bash
      env:
        FILES: ${{ inputs.files }}
        STRICT: ${{ inputs.strict }}
        PRESET: ${{ inputs.preset }}
        EXTRA: ${{ inputs.args }}
      run: |
        # Arrays rather than one flat string. `files` was expanded unquoted so
        # that several paths could be given at once, which also split any path
        # containing a space into two paths that do not exist.
        #
        # One path per line is the unambiguous form and always wins. A single
        # line is ambiguous -- "my video.mp4" and "a.mp4 b.mp4" are the same
        # shape -- so ask the filesystem: if the whole line is a path that
        # exists, it is one path. Only if it is not do we fall back to
        # word-splitting, which keeps `files: "a.mp4 b.mp4"` working.
        targets=()
        while IFS= read -r line; do
          [ -n "$line" ] && targets+=("$line")
        done <<< "$FILES"
        if [ "${#targets[@]}" -le 1 ] && [ ! -e "$FILES" ]; then
          read -ra targets <<< "$FILES"
        fi

        flags=()
        if [ "$STRICT" = "true" ]; then flags+=(--strict); fi
        if [ -n "$PRESET" ]; then flags+=(--preset "$PRESET"); fi

        # Newlines folded to spaces first: `read -ra` stops at the first
        # newline, so a multi-line `args:` block silently lost every flag after
        # the first line and the job still went green. A gate that was asked for
        # and never ran is the failure this whole project is against.
        extra=()
        if [ -n "$EXTRA" ]; then read -ra extra <<< "${EXTRA//$'\n'/ }"; fi

        rendercheck check "${targets[@]}" "${flags[@]}" "${extra[@]}"
