name: Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # arm64 as well as amd64: half the people who render media locally are on
      # an Apple laptop, and an amd64-only image runs under emulation slowly
      # enough that they will conclude the tool is slow.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # An image that cannot find a defect is worse than no image. Pull the tag
      # that was just pushed and make it fail on a file that should fail.
      - name: The published image still catches a defect
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          sudo apt-get update && sudo apt-get install -y ffmpeg
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=6" \
            -af loudnorm=I=-34:TP=-1.5:LRA=11 quiet.wav
          docker run --rm -v "$PWD:/work" "$IMAGE" check /work/quiet.wav \
            && { echo "expected a defect to fail the run"; exit 1; } || test $? -eq 1
