name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify tag matches __version__
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(python -c 'import rendercheck; print(rendercheck.__version__)')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG does not match __version__ $VERSION" >&2
            exit 1
          fi
      - run: pip install build
      - run: python -m build
      - run: pipx run twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: contains(github.ref_name, 'rc')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/rendercheck/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: ${{ !contains(github.ref_name, 'rc') }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rendercheck/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Lists the stdio MCP server in the official registry, which is how an agent
  # finds it. Ordering is a hard constraint rather than a preference: the
  # registry verifies ownership by fetching the *live* PyPI package and looking
  # for the `mcp-name:` marker in its README, so this cannot run until
  # publish-pypi has finished. Authentication is GitHub OIDC -- no stored
  # secret, and it works because the namespace is io.github.rogermsc on
  # rogermsc's own repository.
  publish-registry:
    if: ${{ !contains(github.ref_name, 'rc') }}
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: server.json version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(python -c "import json; print(json.load(open('server.json'))['version'])")
          packaged=$(python -c "import json; print(json.load(open('server.json'))['packages'][0]['version'])")
          if [ "$tag" != "$declared" ] || [ "$tag" != "$packaged" ]; then
            echo "tag $tag but server.json says $declared / package $packaged"
            exit 1
          fi
      - name: Publish to the MCP registry
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  github-release:
    if: ${{ !contains(github.ref_name, 'rc') }}
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # The terminator matches only the *version* link block at the foot of the
      # file (`[0.3.0]: ...`, `[Unreleased]: ...`). Matching any `[x]:` line cut
      # v0.3.0's notes in half at an ordinary markdown link reference sitting
      # inside the section, and the release published with a section missing --
      # silently, which is not a thing this repo gets to ship.
      - name: Extract changelog section
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            /^## \[/           { p = ($0 ~ "\\[" ver "\\]") }
            /^\[(Unreleased|[0-9])[^]]*\]: / { p = 0 }
            p
          ' CHANGELOG.md > notes.md
          # A release whose notes came out empty is a broken release.
          test -s notes.md || { echo "::error::no changelog section for $GITHUB_REF_NAME"; exit 1; }
          grep -q '^## \[' notes.md || { echo "::error::notes lost their heading"; exit 1; }
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
