name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify tag matches __version__
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(python -c 'import rendercheck; print(rendercheck.__version__)')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG does not match __version__ $VERSION" >&2
            exit 1
          fi
      - run: pip install build
      - run: python -m build
      - run: pipx run twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: contains(github.ref_name, 'rc')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/rendercheck/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: ${{ !contains(github.ref_name, 'rc') }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rendercheck/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    if: ${{ !contains(github.ref_name, 'rc') }}
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # The terminator matches only the *version* link block at the foot of the
      # file (`[0.3.0]: ...`, `[Unreleased]: ...`). Matching any `[x]:` line cut
      # v0.3.0's notes in half at an ordinary markdown link reference sitting
      # inside the section, and the release published with a section missing --
      # silently, which is not a thing this repo gets to ship.
      - name: Extract changelog section
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            /^## \[/           { p = ($0 ~ "\\[" ver "\\]") }
            /^\[(Unreleased|[0-9])[^]]*\]: / { p = 0 }
            p
          ' CHANGELOG.md > notes.md
          # A release whose notes came out empty is a broken release.
          test -s notes.md || { echo "::error::no changelog section for $GITHUB_REF_NAME"; exit 1; }
          grep -q '^## \[' notes.md || { echo "::error::notes lost their heading"; exit 1; }
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
