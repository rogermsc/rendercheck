name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,vision]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Build and validate the package
        run: |
          pipx run build
          pipx run twine check --strict dist/*

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # The README claims macOS and Windows. Claims get tested here.
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # The test fixtures are generated with ffmpeg rather than committed as
      # binaries, so the suite cannot run without it. This is the one step that
      # does not carry over from a pure-Python project.
      - name: Install ffmpeg
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "already present" && exit 0
          fi
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            macOS)   brew install ffmpeg ;;
            Windows) choco install ffmpeg -y ;;
          esac
      - run: pip install -e ".[dev,vision]"
      - run: pytest -q --cov --cov-fail-under=80
      - name: Smoke-test the CLI end to end
        shell: bash
        run: |
          # Fades out: audio that stops dead at full level is a defect now, and
          # assert_no_truncation would rightly fail this file without the fade.
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=4" \
            -af "loudnorm=I=-16:TP=-1.5:LRA=11,afade=t=out:st=3.6:d=0.4" clean.wav
          rendercheck check clean.wav --expect-seconds 4
          # A video with no audio must exit non-zero -- the regression that
          # named this library. `!` so a correct failure passes the step.
          ffmpeg -loglevel error -f lavfi -i "color=c=blue:s=320x240" -t 3 noaudio.mp4
          ! rendercheck check noaudio.mp4
          # A path that is not there is a usage error, not a skip.
          rendercheck check definitely-not-here.mp4 || test $? -eq 2
          # A preset moves the target, so the same clean file now reads quiet.
          rendercheck check clean.wav --preset netflix && exit 1 || test $? -eq 1
          rendercheck presets | grep -q "netflix"

  integrations:
    # Every surface we tell people to use, exercised once. An integration that
    # only exists in the README is a claim, not a feature.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate one clean file and one defective one
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -e .
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=6" \
            -af loudnorm=I=-34:TP=-1.5:LRA=11 quiet.wav
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=6" \
            -af "loudnorm=I=-16:TP=-1.5:LRA=11,afade=t=out:st=5.6:d=0.4" clean.wav

      # Note this installs rendercheck from PyPI, which is what the action does
      # for real users -- so it exercises the published package, not this
      # checkout. That is the behaviour under test.
      - name: The action passes a clean file
        uses: ./
        with:
          files: clean.wav

      - name: The action fails the build on a defect
        id: defect
        continue-on-error: true
        uses: ./
        with:
          files: quiet.wav

      - name: ...and that failure was real, not a green build
        run: |
          echo "outcome: ${{ steps.defect.outcome }}"
          test "${{ steps.defect.outcome }}" = "failure"

      - name: The action file keeps its injection guard
        run: |
          pip install pyyaml
          python - <<'PY'
          import yaml

          spec = yaml.safe_load(open("action.yml"))
          assert spec["runs"]["using"] == "composite", spec["runs"]
          assert set(spec["inputs"]) == {
              "files", "strict", "preset", "version", "args",
          }
          check = spec["runs"]["steps"][-1]
          assert check["name"] == "Check", check
          # Inputs must reach the script through the environment. Interpolating
          # them into the run body would be a script-injection hole.
          assert "env" in check, check
          assert "$FILES" in check["run"], check["run"]
          print("action.yml ok")
          PY
          ! rendercheck check quiet.wav --strict

      - name: The npx wrapper passes exit codes through
        run: |
          node npm/bin/rendercheck.js --version
          ! node npm/bin/rendercheck.js check quiet.wav
          node npm/bin/rendercheck.js check /tmp/not-here.wav || test $? -eq 2

      # `npx rendercheck` puts npx's own shim for this package on PATH under the
      # name the wrapper probes for. Resolving to it means spawning yourself,
      # forever. This reproduces that layout; a regression hangs the job rather
      # than failing it, hence the timeouts.
      - name: The npx wrapper does not resolve to itself
        run: |
          SHIM="$PWD/sim/_npx/deadbeef/node_modules/.bin"
          mkdir -p "$SHIM"
          printf '#!/bin/sh\nexec node "%s" "$@"\n' "$PWD/npm/bin/rendercheck.js" > "$SHIM/rendercheck"
          chmod +x "$SHIM/rendercheck"

          # The shim shadows the real CLI: the wrapper must look past it.
          PATH="$SHIM:$PATH" timeout 60 node npm/bin/rendercheck.js --version

          # The backstop, for a shim the path heuristics cannot recognise: being
          # re-entered means we resolved to ourselves, so it must bail with an
          # actionable message rather than delegate again. Asserted directly
          # because PATH cannot be relied on to lack uvx and pipx -- a runner
          # that has them will (correctly) succeed through that fallback.
          timeout 60 env RENDERCHECK_NODE_WRAPPER=1 node npm/bin/rendercheck.js --version \
            && { echo "expected a non-zero exit"; exit 1; } || test $? -eq 2
          env RENDERCHECK_NODE_WRAPPER=1 node npm/bin/rendercheck.js --version 2>&1 \
            | grep -q "resolved to itself"

      # An MCP server that writes one human-readable line to stdout is a broken
      # server, and nothing about it looks broken until a client disconnects.
      - name: The MCP server speaks nothing but protocol on stdout
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"check_media","arguments":{"path":"quiet.wav"}}}' \
            | timeout 120 rendercheck mcp > session.jsonl
          python - <<'PY'
          import json

          replies = [json.loads(line) for line in open("session.jsonl") if line.strip()]
          # Three requests, one notification: the notification must go unanswered.
          assert len(replies) == 3, replies
          assert replies[0]["result"]["protocolVersion"] == "2025-06-18", replies[0]
          body = replies[2]["result"]["structuredContent"]
          assert body["ok"] is False, body
          assert any(
              r["status"] == "FAIL" and r["check"] == "loudness"
              for r in body["files"][0]["results"]
          ), body
          print("mcp session ok")
          PY

      - name: The Docker image builds and catches a defect
        run: |
          docker build -t rendercheck:ci .
          docker run --rm -v "$PWD:/work" rendercheck:ci check /work/clean.wav
          docker run --rm -v "$PWD:/work" rendercheck:ci check /work/quiet.wav \
            && { echo "expected the defect to fail"; exit 1; } || test $? -eq 1

      - name: The config file sets defaults and flags still beat it
        run: |
          mkdir -p project && cd project
          cp ../clean.wav .
          printf 'preset = "netflix"\n' > rendercheck.toml
          # The config makes a -16 file read as far too loud for its target...
          rendercheck check clean.wav && { echo "config was ignored"; exit 1; } \
            || test $? -eq 1
          # ...and a flag typed on the command line still overrides it.
          rendercheck check clean.wav --target-lufs -16 --loudness-tol 2
          # A key that does not exist is reported, not silently dropped.
          printf 'max_slience = 9.0\n' > rendercheck.toml
          rendercheck check clean.wav 2>&1 | grep -q "unknown option 'max_slience'"

      - name: The promptfoo assertion grades a real file
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "examples/promptfoo")
          from rendercheck_assert import get_assert

          bad = get_assert("quiet.wav")
          assert bad["pass"] is False, bad
          assert "LUFS" in bad["reason"], bad

          missing = get_assert("/tmp/not-here.wav")
          assert missing["pass"] is False, missing

          # A preset moves the target the eval grades against.
          loud = get_assert("clean.wav", {"vars": {"preset": "netflix"}})
          assert loud["pass"] is False, loud
          assert "-27 target" in loud["reason"], loud
          assert get_assert("clean.wav")["pass"] is True

          # A preset that does not exist is a graded failure naming the typo,
          # not an exception that takes the whole eval run down with it.
          typo = get_assert("clean.wav", {"vars": {"preset": "youtub"}})
          assert typo["pass"] is False, typo
          assert "unknown preset" in typo["reason"], typo
          print("promptfoo shim ok")
          PY
